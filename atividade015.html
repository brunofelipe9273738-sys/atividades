<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h1 id="titulogeral" class="titulogeral">cadastro</h1>
    <form action="">
        <label for="nome">insira seu nome completo:</label>
        <input type="text" id="nome" class="nome">

        <br><br>
        <label for="senha">digite uma senha:</label>
        <input type="password" id="senha" class="senha">

        <br><br>
        <label for="email">digite seu email:</label>
        <input type="email" id="email" class="email">

        <br><br>
        <label for="datanasc">data de nascimento</label>
        <input type="date" id="datanasc" class="datanasc">
    </form>

</body>
</html>
