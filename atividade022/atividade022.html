<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    
    body{
    background: url(img/arvore.jpg);
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    background-attachment: fixed;
    position: relative;

}
    form{
        background: rgba(255, 255, 255, 0.15);
        width: 350px;
        color: white;
        margin-left: 778px;
        border-radius: 15px;

}
#ddd2{
    width: 50px;
}
#ddd3{
    width: 120px;
}
#envi{
    margin-left: 20px;
}
</style>
<body>
    <div class="caixa">
    <form action="https://sheetdb.io/api/v1/xg7fo1peb0nra" method="post">
    
        <h1>Formulário de Cadastro</h1>

        <label for="name" id="name">Nome</label>
        <input type="text" id="Nome" placeholder="Nome" name="data[Nome]"><br>

        <label for="nim" id="nim1">Sobrenome</label>
        <input type="text" id="nim2" placeholder="sobrenome" name="data[Sobrenome]">
<br><br>
        <label for="empr" id="empr1">Empresa</label><br>
        <input type="text" id="empr2" name="data[Empresa]">
<br><br>

        <label for="email" id="email1">E-mail</label><br>
        <input type="email" id="email" name="data[E-mail]">
<br><br>

        <label for="ass" id="ass1">Assunto</label><br>
        <textarea name="ass" id="ass2" name="data[Assunto]"></textarea>
<br><br>

        <label for="ddd" id="ddd">Telefone com DDD</label>
        <input type="number" id="ddd2" name="data[DDD]"> <input type="number" name="data[Telefone]" id="ddd3">

<br><br>

        <label for="sex" id="sex1">Sexo</label>
        <select name="data[Sexo]" id="sex">
        <option value="" disabled selected>-Selecione uma opção</option>
        <option value="masc">Masculino</option>
        <option value="fem">Feminino</option>
        <option value="sla">Não tenho</option>
        </select><br><br>


    <label for="" id="vc">Você está começando na programação?</label><br>
    <input type="radio" name="data[Sim]" id="masc">
    <label for="masc" id="sim">Sim</label> 
    
    <input type="radio" name="data[Não]" id="fem">
    <label for="fem" id="nao">Não</label>

    <br><br>    
    <button type="submit" id="envi">Enviar</button>
    </form>
    </div>
</body>
</html>
