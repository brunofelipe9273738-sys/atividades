<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button onclick="mostrarHora()">Avançar</button>

    <script>

        function mostrarHora() {

            let hora = 14;

            if (hora < 12) {
                alert("Bom dia!");
            } else if (hora < 18) {
                alert("Boa tarde!");
            } else {
                alert("Boa noite!");
            }

        }

    </script>

</body>
</html>
