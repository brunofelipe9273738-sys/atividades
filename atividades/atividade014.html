<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inputs</title>
</head>
<body>
    <h1 id="titulogeral" class="titulogeral">lista</h1>
    <br><br>
    <form action="">
        <label for="nome">Nome</label>
        <input type="text" id="nome" class="nome">
        
        <br><br>
        <label for="contato">Telefone</label>
        <input type="tel" id="contato" class="contato" name="contato">
        <input type="submit" value="Enviar">

        <br><br>
        <label for="email">Email</label>
        <input type="email" id="email" class="email">

        <br><br>
        <label for="sla">Deseja receber novidades?</label>
        <label for="sim">sim</label>
        <input type="radio" name="sla" id="sim">
        <label for="nao">não</label>
        <input type="radio" name="sla" id="não">

        <br><br>
        <label for="mensagem">Mensagem</label>
        <textarea name="mensagem" id="mensagem" rows="5" cols="40" placeholder="Digite algo aqui"></textarea><br><br>
        <input type="reset" value="Limpar Capos">
    </form>
</body>
</html>
