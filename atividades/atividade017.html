<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coisas</title>
    
        <style>
        fieldset{
            width: 500px;
            margin: 10px auto;
        }
        label{
            font-weight: bold;
            display: inline-block;
        }
        input{
            margin-bottom: 5px;
        }
        textarea{
            width: 250px;
            height: 60px;
        }
        #bntlogin{
            margin-top: 10px;
            padding: 3px;
            cursor: pointer;
        }
        li{
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1 id="titulogeral" class="titulogeral"></h1>

    <form action="">
        <fieldset>
        <legend>Your details</legend>
        <label for="nome">1. Nome</label>
        <input type="text" name="nome" id="nome" placeholder="First and last name">
            <br>
        <label for="email">2. email</label>
        <input type="email" name="email" id="email" placeholder="example@domain.com">
            <br>
        <label for="contato">3. telefone</label>
        <input type="tel" name="contato" id="contato" placeholder="Eg. +447500000000">
        
        </fieldset>
        <fieldset>
        <legend>Delivery address</legend>
        <label for="mensagem">1. Address</label>
        <textarea name="mensagem" id="mensagem" rows="5" cols="40" placeholder=""></textarea>
        <br>
        <label for="post">2. Post Code</label>
        <input type="number" name="post" >
        <br>
        <label for="contry">3. Country</label>
        <input type="text" name="country"> 
        </fieldset>
        
        <fieldset>
        <fieldset>
        <legend>Card type</legend>
        
    <ol>
        <li><input type="radio" name="cartao">VISA</li>
        <li><input type="radio" name="cartao">AmEx</li>
        <li><input type="radio" name="cartao">Mastercard</li>
    </ol>
    </fieldset>
    <label for="cod">2.Card number</label>
    <input type="number" id="cod"   class="cod">
    <br>
    <label for="cod">3.Security code</label>
    <input type="number" id="cod"   class="cod">
    <br>
    <label for="nome">4.Name on card</label>
    <input type="text" placeholder="Exact name as on the card"><br>
    <fieldset>
    <input type="submit" value="Buy it!" id="bntlogin">
    </fieldset>



</fieldset>
    </form>
    

</body>
</html>
