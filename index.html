<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs</title>
    <style>
        label{
            font-weight: bold;
            margin-top: 6px;
        }
        input[type="text"],
        input[type="password"]{
            padding: 8px;
            border: 1px solid black;
            border-radius: 4px;
            font-size: 16px;
        }
        #bntlogin{
            margin-top: 15px;
            padding: 8px;
            background-color: aquamarine;
            cursor: pointer;
        }
        fieldset{
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            margin: 0 auto;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1 id="titulogeral" class="titulogeral">Lista de Inputs - HTML</h1>
    <br><br>
    <form action="">
    <label for="nome">Nome</label>
    <input type="text" id="nome" class="nome">
    
    <br><br>
    <label for="senha">Senha</label>
    <input type="password" id="senha" class="senha">
    
    <br><br>
    <label for="cpf">CPF</label>
    <input type="number" id="cpf" class="cpf">

    <br><br>
    <label for="email">Email</label>
    <input type="email" id="email" class="email">

    <br><br>
    <label for="datanasc">Data de Nascimento</label>
    <input type="date" id="datanasc" class="datanasc">

    <br><br>
    <label for="cor">Cor do Veiculo</label>
    <input type="color" id="cor" class="cor">

    <br><br>
    <label for="hora">Horario</label>
    <input type="time" id="hora" class="hora">

    <br><br>
    <label for="week">Dia da Semana</label>
    <input type="week" id="week" class="week">

    <br><br>
    <label for="masc">Masculino</label>
    <input type="radio" name="masc" id="masc">

    <br><br>
    <label for="fem">Feminino</label>
    <input type="radio" name="fem" id="fem">

    <br><br>
    <label for="func">Analista</label>
    <input type="checkbox" id="func" class="func" name="funcao">
    <br>
    <label for="gsti">Gerente de Tecnologia</label>
    <input type="checkbox" class="gsti" id="csti" name="funcao">

    <br><br>
    <label for="vol">Volume</label>
    <input type="range" id="vol" class="vol">

    <br><br>
    <label for="arquivo">Escolha um arquivo formato: .pdf, .png, .jpg</label>
    <input type="file" id="arquivo" class="arquivo" accept=".pdf, .png , .jpg">
    
    <br><br>
    <label for="busca">Pesquisar</label>
    <input type="search" id="busca" class="busca" name="busca">

    <br><br>
    <label for="url">Endereço do Site</label>
    <input type="url" id="url" class="url" name="url">

    <br><br>
    <label for="contato">Telefone</label>
    <input type="tel" id="contato" class="contato" name="contato">
    <input type="submit" value="Enviar">

    <br><br>
    <label for="cidade">Escolha sua ciadade</label>
    <select name="cidade" id="cidade">
        <option value="" disabled selected>Selecione uma opção</option>
        <option value="moc">MONTES CLAROS</option>
        <option value="pira">PIRAPORA</option>
        <option value="jana">JANAÚBA</option>
    </select><br><br>

    <label for="mensagem">Mensagem</label>
    <textarea name="mensagem" id="mensagem" rows="5" cols="40" placeholder="Digite sua mensagem aqui"></textarea><br><br>
    <br><br>

    <form action="">
        <fieldset>
        <legend>Formulario de login</legend>
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome">

        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha">
        
        <input type="submit" value="login" id="bntlogin">
        </fieldset>
    </form>
    
    
    <br><br>
    <input type="reset" value="Limpar Campos">
</form>
</body>
</html>
